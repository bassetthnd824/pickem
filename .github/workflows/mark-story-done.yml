# After a pull request merges to main, mark its user story done in
# docs/user-stories.md.
#
# A pull request specifies a story when exactly one id is named by its head
# branch (US-NN-slug or dir/US-NN-slug), its title (a US-NN token), or a line
# that is only US-NN in the body or a commit message. Ids mentioned inside a
# sentence do not count. Zero ids or several ids leave the file unchanged.
#
# pull_request_target runs the workflow from the default branch, not from the
# pull request head. The job runs the script from the pre-merge main commit
# (pull_request.base.sha). A pull request cannot replace the script that edits
# main in the same run. Script changes on main apply to the next merge.
#
# main requires the "Build and test" check before a push is accepted. The job
# pushes the status commit to automation/story-status/*, dispatches CI there,
# and fast-forwards main only after that check succeeds.
#
# A workflow_dispatch job check does not satisfy the ruleset, even when the
# job succeeds. After CI passes, the job publishes a commit status with the
# context "Build and test". The ruleset accepts that status from GitHub Actions.

name: Mark user story done

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read
  actions: write
  statuses: write

concurrency:
  group: mark-story-done-main
  cancel-in-progress: false

jobs:
  mark-story-done:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Load the pre-merge story script
        id: script
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/marker"
          if git cat-file -e "${BASE_SHA}:.github/scripts/mark-story-done.mjs" \
            && git cat-file -e "${BASE_SHA}:.github/scripts/mark-story-done.test.mjs"; then
            git show "${BASE_SHA}:.github/scripts/mark-story-done.mjs" > "${RUNNER_TEMP}/marker/mark-story-done.mjs"
            git show "${BASE_SHA}:.github/scripts/mark-story-done.test.mjs" > "${RUNNER_TEMP}/marker/mark-story-done.test.mjs"
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          elif git cat-file -e "${BASE_SHA}:.github/workflows/mark-story-done.yml"; then
            echo "The story workflow is on the pre-merge commit, but its script is missing." >&2
            exit 1
          else
            echo "This merge adds the story-status workflow. It marks stories starting with the next merge to main."
            echo "ready=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Test the story script
        if: steps.script.outputs.ready == 'true'
        run: node --test "${RUNNER_TEMP}/marker/mark-story-done.test.mjs"

      - name: Resolve the user story
        id: story
        if: steps.script.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node "${RUNNER_TEMP}/marker/mark-story-done.mjs" --resolve

      - name: Leave the index unchanged
        if: steps.script.outputs.ready == 'true' && steps.story.outputs.reason == 'none'
        run: echo "This pull request does not specify a user story. docs/user-stories.md was left unchanged."

      - name: Leave the index unchanged when several stories are named
        if: steps.script.outputs.ready == 'true' && steps.story.outputs.reason == 'conflict'
        run: |
          echo "::warning title=Story status not updated::This pull request names more than one user story (${{ steps.story.outputs.story_ids }}). docs/user-stories.md was left unchanged."

      - name: Commit the story status on main
        if: steps.script.outputs.ready == 'true' && steps.story.outputs.reason == 'unique'
        env:
          STORY_ID: ${{ steps.story.outputs.story_id }}
          PR_NUMBER: ${{ steps.story.outputs.pr_number }}
          PR_URL: ${{ steps.story.outputs.pr_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "${STORY_ID}" in
            US-[0-9][0-9]|US-[0-9][0-9][0-9]) ;;
            *) echo "Refusing unexpected story id: ${STORY_ID}" >&2; exit 1 ;;
          esac
          case "${PR_NUMBER}" in
            ''|*[!0-9]*) echo "Refusing unexpected pull request number" >&2; exit 1 ;;
          esac
          case "${PR_URL}" in
            https://*/pull/"${PR_NUMBER}") ;;
            *) echo "Refusing unexpected pull request URL" >&2; exit 1 ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          script="${RUNNER_TEMP}/marker/mark-story-done.mjs"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout --detach origin/main
            node "${script}" --apply --story "${STORY_ID}" --pr "${PR_NUMBER}" --url "${PR_URL}" --file docs/user-stories.md
            if git diff --quiet -- docs/user-stories.md; then
              echo "${STORY_ID} is already marked done."
              exit 0
            fi
            git add docs/user-stories.md
            git commit -m "docs(stories): mark ${STORY_ID} done" -m "${STORY_ID}"
            sha="$(git rev-parse HEAD)"
            branch="automation/story-status/${STORY_ID}/${GITHUB_RUN_ID}-${attempt}"
            git push origin "HEAD:refs/heads/${branch}"
            gh workflow run ci.yml --ref "${branch}"
            run_id=""
            for _ in $(seq 1 30); do
              run_id="$(gh run list --workflow ci.yml --commit "${sha}" --event workflow_dispatch --limit 5 --json databaseId --jq ".[0].databaseId // empty")"
              if [ -n "${run_id}" ]; then
                break
              fi
              sleep 5
            done
            if [ -z "${run_id}" ]; then
              echo "CI did not start for ${sha}." >&2
              exit 1
            fi
            echo "Waiting for Build and test on ${branch} (run ${run_id})."
            if ! gh run watch "${run_id}" --exit-status; then
              echo "Build and test failed: $(gh run view "${run_id}" --json url --jq .url)" >&2
              exit 1
            fi
            # The workflow_dispatch check is ignored by the ruleset. Publish the
            # same context as a commit status so the fast-forward is accepted.
            ci_url="$(gh run view "${run_id}" --json url --jq .url)"
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
              -f state=success \
              -f context="Build and test" \
              -f description="CI passed for the story status commit" \
              -f target_url="${ci_url}"
            push_log="${RUNNER_TEMP}/push-${attempt}.log"
            pushed=0
            for push_try in 1 2 3 4 5 6; do
              if git push origin "${sha}:refs/heads/main" >"${push_log}" 2>&1; then
                pushed=1
                break
              fi
              cat "${push_log}" >&2
              if grep -Eq "non-fast-forward|fetch first|behind its remote" "${push_log}"; then
                echo "main moved while CI ran. Retrying the status commit."
                break
              fi
              if ! grep -Eq "GH013|Required status check|repository rule violations" "${push_log}"; then
                echo "Push to main failed." >&2
                exit 1
              fi
              echo "Waiting for the ruleset to see Build and test (${push_try}/6)."
              sleep 10
            done
            if [ "${pushed}" -eq 1 ]; then
              git push origin --delete "${branch}" || echo "Could not delete ${branch}."
              echo "Marked ${STORY_ID} done on main."
              exit 0
            fi
            git push origin --delete "${branch}" || echo "Could not delete ${branch}."
            if ! grep -Eq "non-fast-forward|fetch first|behind its remote" "${push_log}"; then
              echo "Could not push the story status update." >&2
              exit 1
            fi
          done
          echo "Could not push the story status update." >&2
          exit 1
