name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # Each sha gets its own entry so a restored cache can still be updated.
      # restore-keys loads the newest entry for this job.
      - uses: actions/cache/restore@v5
        id: nx-cache
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ github.job }}-
      - run: npm ci
      - run: chmod +x mvnw
      - run: npx nx show projects
      - run: npx nx build frontend
      - uses: actions/cache/save@v5
        if: always() && steps.nx-cache.outputs.cache-hit != 'true'
        with:
          path: .nx/cache
          key: ${{ steps.nx-cache.outputs.cache-primary-key }}

  test-frontend:
    name: Test frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache/restore@v5
        id: nx-cache
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ github.job }}-
      - run: npm ci
      - run: chmod +x mvnw
      - run: npx nx show projects
      - run: npx nx test frontend
      - uses: actions/cache/save@v5
        if: always() && steps.nx-cache.outputs.cache-hit != 'true'
        with:
          path: .nx/cache
          key: ${{ steps.nx-cache.outputs.cache-primary-key }}

  build-backend:
    name: Build backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # nx-maven writes to .m2/repository, not the ~/.m2/repository path setup-java caches.
      - uses: actions/cache@v5
        with:
          path: |
            .m2/repository
            ~/.m2/wrapper/dists
          key: ${{ runner.os }}-maven-${{ github.job }}-${{ hashFiles('pom.xml', 'apps/backend/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ github.job }}-
            ${{ runner.os }}-maven-
      - uses: actions/cache/restore@v5
        id: nx-cache
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ github.job }}-
      - run: npm ci
      - run: chmod +x mvnw
      - run: npx nx show projects
      - run: npx nx build backend
      - uses: actions/cache/save@v5
        if: always() && steps.nx-cache.outputs.cache-hit != 'true'
        with:
          path: .nx/cache
          key: ${{ steps.nx-cache.outputs.cache-primary-key }}

  test-backend:
    name: Test backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # nx-maven writes to .m2/repository, not the ~/.m2/repository path setup-java caches.
      - uses: actions/cache@v5
        with:
          path: |
            .m2/repository
            ~/.m2/wrapper/dists
          key: ${{ runner.os }}-maven-${{ github.job }}-${{ hashFiles('pom.xml', 'apps/backend/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ github.job }}-
            ${{ runner.os }}-maven-
      - uses: actions/cache/restore@v5
        id: nx-cache
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ github.job }}-
      - run: npm ci
      - run: chmod +x mvnw
      - run: npx nx show projects
      - run: npx nx test backend
      - uses: actions/cache/save@v5
        if: always() && steps.nx-cache.outputs.cache-hit != 'true'
        with:
          path: .nx/cache
          key: ${{ steps.nx-cache.outputs.cache-primary-key }}

  # Required check on main. strict_required_status_checks_policy is false, so a
  # skipped check would not block merging. This job always runs and fails unless
  # all four jobs succeeded.
  build:
    name: Build and test
    needs:
      - build-frontend
      - test-frontend
      - build-backend
      - test-backend
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require frontend and backend build and test
        run: |
          echo "Build frontend: ${{ needs.build-frontend.result }}"
          echo "Test frontend: ${{ needs.test-frontend.result }}"
          echo "Build backend: ${{ needs.build-backend.result }}"
          echo "Test backend: ${{ needs.test-backend.result }}"
          test "${{ needs.build-frontend.result }}" = "success"
          test "${{ needs.test-frontend.result }}" = "success"
          test "${{ needs.build-backend.result }}" = "success"
          test "${{ needs.test-backend.result }}" = "success"
