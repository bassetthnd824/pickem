spring:
  application:
    name: backend
  cloud:
    gcp:
      secretmanager:
        enabled: ${PICKEM_SECRET_MANAGER_ENABLED:false}

pickem:
  secrets:
    secret-manager-enabled: ${PICKEM_SECRET_MANAGER_ENABLED:false}
    # OS environment and .env win. Secret Manager (sm@) is the fallback
    # when PICKEM_SECRET_MANAGER_ENABLED=true.
    cfbd-api-key: ${CFBD_API_KEY:${sm@cfbd-api-key:}}

---
spring:
  config:
    activate:
      on-property: pickem.secrets.secret-manager-enabled
    import: sm@
  cloud:
    gcp:
      secretmanager:
        enabled: true
