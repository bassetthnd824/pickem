spring:
  application:
    name: backend
  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false
  cloud:
    gcp:
      # Firestore client is created in FirestoreConfig so the emulator can
      # run without application-default credentials.
      firestore:
        enabled: false
      secretmanager:
        enabled: ${PICKEM_SECRET_MANAGER_ENABLED:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

pickem:
  auth:
    # Firebase Admin allows 5 minutes through 14 days. Product window is 5-14 days.
    session-duration: ${PICKEM_AUTH_SESSION_DURATION:P14D}
    # Admin SDK reads FIREBASE_AUTH_EMULATOR_HOST from the process environment.
    # This binding also accepts the value from .env so startup can publish it.
    emulator-host: ${FIREBASE_AUTH_EMULATOR_HOST:}
  firestore:
    project-id: ${GOOGLE_CLOUD_PROJECT:pickem-local}
    emulator-enabled: ${FIRESTORE_EMULATOR_ENABLED:false}
    emulator-host: ${FIRESTORE_EMULATOR_HOST:}
  secrets:
    secret-manager-enabled: ${PICKEM_SECRET_MANAGER_ENABLED:false}
    # OS environment and .env win. Secret Manager (sm@) is the fallback
    # when PICKEM_SECRET_MANAGER_ENABLED=true. Never send this to the browser.
    cfbd-api-key: ${CFBD_API_KEY:${sm@cfbd-api-key:}}
  cfbd:
    base-url: https://api.collegefootballdata.com
  internal:
    # Shared with the Next.js BFF. Not a session cookie. Blank disables the
    # secret and leaves loopback (below) as the local admission path.
    job-secret: ${PICKEM_INTERNAL_JOB_SECRET:${sm@pickem-internal-job-secret:}}
    # Local stand-in for a Cloud Run identity token. Cloud Run sets K_SERVICE,
    # which turns loopback off even when this flag stays true. Set the flag
    # false to require the secret on a non-Cloud-Run host.
    allow-loopback: ${PICKEM_INTERNAL_ALLOW_LOOPBACK:true}

---
spring:
  config:
    import: ${PICKEM_SECRET_MANAGER_IMPORT:}
  cloud:
    gcp:
      secretmanager:
        enabled: ${PICKEM_SECRET_MANAGER_ENABLED:false}
